name: Build On Commit
on:
  push:
    branches:
      - master
      - develop
jobs:
  e2e-tests:
    uses: ./.github/workflows/e2e-tests.yml
  publish:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: e2e-tests
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: branch
      - name: Derive docker hub repo name
        id: repo_name
        shell: bash
        run: |
          REGEX="/ab_service_(.+)"
          [[ "${{ github.repository }}" =~ $REGEX ]]
          OWNER="${{ github.repository_owner }}"
          echo "docker_hub_repo=ghcr.io/${OWNER,,}/ab-${BASH_REMATCH[1]//_/-}" >> $GITHUB_OUTPUT
      - name: Get commit sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Check out the git repo
        uses: actions/checkout@v3
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: BRANCH=${{ steps.branch.outputs.branch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.repo_name.outputs.docker_hub_repo }}:${{ steps.branch.outputs.branch }}
            ${{ steps.repo_name.outputs.docker_hub_repo }}:${{ steps.sha.outputs.short }}
